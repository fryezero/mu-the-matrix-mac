name: Mac track checks

# The project targets macOS only, so nothing runs automatically: the gate before
# merging is scripts/local-macos-ci.sh on a Mac. This workflow runs only when
# started by hand (macOS runners are billed at ten times the Linux rate).
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install the MinGW cross-compiler
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install mingw-w64
      - name: Local CI script
        run: bash scripts/local-macos-ci.sh python3
